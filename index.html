 const value=expression();if(i!==t.length)throw Error('式の形を確認してね');return value}
function simplest(text,correct){let s=String(text).replace(/\s/g,'').replace(/−|－|ー/g,'-').replace(/＋/g,'+').replace(/／/g,'/');if(s==='0')return Object.keys(correct).length===0;
 const terms=s.match(/[+-]?[^+-]+/g)||[];const seen=new Set();if(!terms.length)return false;
 for(const v of terms){const m=v.match(/^([+-]?)(\d*)(?:√(\d+))?(?:\/(\d+))?$/);if(!m)return false;const [,sign,num,rootnum,dennum]=m;if(!num&&!rootnum)return false;const n=num?Number(num):1,d=dennum?Number(dennum):1,r=rootnum?Number(rootnum):1;if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d<1||n===0)return false;if(dennum&&(d===1||gcd(n,d)!==1))return false;if(rootnum){if(r===1||sqfree(r).c!==1)return false;if(num==='1')return false}else if(!num)return false;if(seen.has(r))return false;seen.add(r);}
 return seen.size===Object.keys(correct).length
}
function answerQ(prompt,correct,explanation,hint,sub='答えを最も簡単な形で入力しよう'){return {prompt,type:'input',result:correct,answer:fmt(correct),explanation,hint,sub}}
function choiceQ(prompt,answer,wrong,explanation,hint,sub='正しいものを選ぼう'){let choices=[String(answer),...wrong.map(String).filter(x=>String(x)!==String(answer))];choices=[...new Set(choices)];let f=0;while(choices.length<4){const v=String(Number(answer)+f+rand(1,7));if(!choices.includes(v))choices.push(v);f++}return {prompt,type:'choice',answer:String(answer),choices:shuffle(choices.slice(0,4)),explanation,hint,sub}}
function genQuestion(stage,rank=7){let a,b,c,d,n,v,k,z;
 switch(stage){
 case 0:{a=rand(1,rank<3?5:rank<6?9:12);const ans=a*a;return choiceQ(`${a}² はいくつ？`,ans,[a+a,ans+1,Math.max(0,ans-a),ans+a],`${a}² は ${a}×${a}。したがって ${ans} だよ。`,'「2乗」は同じ数を2回かけること。')}
 case 1:{a=rand(0,rank<3?6:rank<6?10:14);const ans=a*a;return choiceQ(`√${ans} の値は？`,a,[a+1,Math.max(0,a-1),ans,a+2],`${a}×${a}=${ans}。だから √${ans}=${a} になるよ。`,'√の中の数になるように、同じ数を2回かけてみよう。')}
 case 2:{a=rand(1,rank<3?4:rank<6?8:12);b=rand(1,2*a);n=a*a+b;return choiceQ(`√${n} は、どの2つの整数の間？`,`${a} と ${a+1}`,[`${a-1} と ${a}`,`${a+1} と ${a+2}`,`${a+2} と ${a+3}`],`${a}²=${a*a}、${a+1}²=${(a+1)*(a+1)}。${a*a}<${n}<${(a+1)*(a+1)} なので、${a} と ${a+1} の間！`,'√の中の数を、連続する平方数ではさんでみよう。')}
 case 3:{a=rand(2,rank<3?3:7);b=pick(rank<3?[2,3,5]:SF);n=a*a*b;return answerQ(`√${n} を簡単にすると？`,root(n),`√${n}=√(${a*a}×${b})=${a}√${b}。${a*a}は平方数だね。`,`まず ${n} を、4・9・16・25・36などで割ってみよう。`)}
 case 4:{if(rank<3||Math.random()<.68){a=rand(2,rank<3?5:12);b=rand(2,rank<3?5:12);return answerQ(`√${a} × √${b} = ?`,times(root(a),root(b)),`√${a}×√${b}=√${a*b}=${fmt(root(a*b))}。`,`√a×√b=√(a×b) だよ。`)}a=pick([2,3,5,7]);b=pick([2,3,5,6,7,10,11]);n=a*b;return answerQ(`√${n} ÷ √${a} = ?`,divide(root(n),root(a)),`√${n}÷√${a}=√(${n}÷${a})=√${b}=${fmt(root(b))}。`,'まず√の中身どうしでわり算しよう。')}
 case 5:{a=pick(rank<3?[2,3]:[2,3,5,7,11]);b=rand(1,rank<3?4:7);c=rand(1,rank<3?3:5);const plusMode=Math.random()<.6;const hi=plusMode?b:Math.max(b,c)+rand(1,4);const lo=plusMode?c:Math.min(hi-1,c);const left=times(integer(hi),root(a)),right=times(integer(lo),root(a));return answerQ(`${fmt(left)} ${plusMode?'+':'−'} ${fmt(right)} = ?`,plusMode?plus(left,right):minus(left,right),`√${a} の部分が同じだから係数だけ計算する。${hi}${plusMode?'+':'−'}${lo}=${plusMode?hi+lo:hi-lo}。`,'√の中が同じなら、前についている数だけ足し引きしよう。')}
 case 6:{v=rank<3?0:rand(0,2);b=pick(rank<3?[2,3]:[2,3,5,7]);a=rand(2,rank<3?3:6);c=rand(2,rank<3?3:6);n=a*a*b;k=c*c*b;if(v===0)return answerQ(`√${n} + √${k} = ?`,plus(root(n),root(k)),`√${n}=${a}√${b}、√${k}=${c}√${b}。足すと ${(a+c)}√${b}。`,'両方を先に a√b の形に直そう。');if(v===1){if(c>=a)[a,c]=[c+1,a];n=a*a*b;k=c*c*b;return answerQ(`√${n} − √${k} = ?`,minus(root(n),root(k)),`√${n}=${a}√${b}、√${k}=${c}√${b}。引くと ${(a-c)}√${b}。`,'先にルートを簡単にすると同じ√が現れるよ。')}return answerQ(`√${a*b} × √${c*b} = ?`,times(root(a*b),root(c*b)),`√(${a*b}×${c*b})=√${a*c*b*b}=${fmt(times(root(a*b),root(c*b)))}。`,`中の数をかけてから平方数を見つけよう。`)}
 case 7:{a=pick(rank<3?[2,3,5]:[2,3,5,6,7]);b=pick((rank<3?[2,3,5]:[2,3,5,6,7]).filter(v=>v!==a));if(Math.random()<.5){const ans=divide(root(a),root(b));return answerQ(`√${a} / √${b} を有理化すると？`,ans,`分子と分母に√${b}をかけると √${a*b}/${b}。整理すると ${fmt(ans)}。`,'分母と分子に同じ√をかけて、分母の√を消そう。')}c=rand(1,5);const ans=divide(integer(c),root(b));return answerQ(`${c} / √${b} を有理化すると？`,ans,`分母と分子に√${b}をかける。${c}√${b}/${b} を整理して ${fmt(ans)}。`,'√b×√b=b になることを使おう。')}
 case 8:{v=rand(0,4);a=pick([2,3,5,6,7,8,10,12,18,20,27,32,50,72]);if(v===0){const ans=times(integer(4),root(a));return answerQ(`1辺が√${a} cm の正方形。周の長さは？`,ans,`周の長さは1辺×4。4×√${a}=${fmt(ans)} cm。`,'正方形の周の長さ＝1辺×4。','単位は書かずに答えよう（cm）')}if(v===1){return answerQ(`面積が ${a} cm² の正方形。1辺の長さは？`,root(a),`1辺の長さは √${a}=${fmt(root(a))} cm。`,'正方形の面積＝1辺×1辺。','単位は書かずに答えよう（cm）')}if(v===2){b=pick([2,3,5,6,7,8]);const ans=times(root(a),root(b));return answerQ(`縦√${a} cm、横√${b} cm の長方形。面積は？`,ans,`面積＝縦×横＝√${a}×√${b}=${fmt(ans)} cm²。`,'長方形の面積＝縦×横。','単位は書かずに答えよう（cm²）')}if(v===3){b=pick([2,3,5,6,7]);const corrected=times(integer(2),plus(root(a),root(b)));return answerQ(`縦√${a} cm、横√${b} cm。長方形の周の長さは？`,corrected,`周の長さ＝(縦＋横)×2=${fmt(corrected)} cm。`,'縦と横をそれぞれ2本ずつ足すよ。','単位は書かずに答えよう（cm）')}
 a=rand(2,7);return answerQ(`1辺が ${a}√2 cm の正方形。面積は？`,times(times(integer(a),root(2)),times(integer(a),root(2))),`(${a}√2)×(${a}√2)=${a*a}×2=${a*a*2} cm²。`,'(a√b)²=a²×b。','単位は書かずに答えよう（cm²）')}
 default:{v=rand(0,7);a=pick([2,3,5,6,7]);b=pick([2,3,5,6,7].filter(x=>x!==a));c=rand(2,5);d=rand(1,3);
 if(v===0){const left=plus(root(a),root(b));const ans=times(left,root(a));return answerQ(`(√${a} + √${b}) × √${a} = ?`,ans,`分配法則で √${a}×√${a} + √${b}×√${a} = ${fmt(ans)}。`,'かっこの各項に√をかけよう。')}
 if(v===1){n=c*c*a;k=d*d*a;const ans=minus(root(n),root(k));return answerQ(`√${n} − √${k} = ?`,ans,`√${n}=${c}√${a}、√${k}=${d}√${a}。よって ${fmt(ans)}。`,'平方数を外に出して、同じ√をまとめよう。')}

 if(v===3){n=c*c*a;k=d*d*a;const ans=plus(root(n),root(k));return answerQ(`√${n} + √${k} = ?`,ans,`√${n}=${c}√${a}、√${k}=${d}√${a}。よって ${fmt(ans)}。`,'ルートを簡単にしてから足そう。')}
 if(v===4){const ans=times(plus(root(a),root(b)),plus(root(a),root(b)));return answerQ(`(√${a}+√${b})(√${a}+√${b}) = ?`,ans,`(x+y)²=x²+2xy+y²。したがって ${fmt(ans)}。`,'4つの積を出してまとめよう。')}
 if(v===5){const ans=plus(times(root(a*c),root(b*d)),root(a*b));return answerQ(`√${a*c} × √${b*d} + √${a*b} = ?`,ans,`かけ算を先に実行して、各項を簡単にすると ${fmt(ans)}。`,'×が先。最後に同じルートの項を足せるか確認。')}

function makeQuestions(stage,count,progressive=true){const out=[],prev=new Set();let tries=0;while(out.length<count&&tries<300){tries++;const q=genQuestion(stage,progressive?out.length:7);if(prev.has(q.prompt))continue;prev.add(q.prompt);out.push(q)}while(out.length<count)out.push(genQuestion(stage,progressive?out.length:7));return out}

function game(){const q=currentQ();if(!q)return '<p>問題を準備できませんでした。</p>';return `<div class="game-container"><div class="game-top"><span class="pill">${app.mode==='lesson'?'じっくり学習':app.mode==='sprint'?'記録に挑戦':'チーム対抗戦'}</span><button class="btn ghost small" data-action="exitGame">✕ 終了</button></div>${gameTop()}<section class="question-panel"><div class="question-label">QUESTION ${app.mode==='lesson'?app.idx+1:app.mode==='sprint'?app.idx+1:app.turn+1}</div><div class="question">${esc(q.prompt)}</div><p class="subquestion">${esc(q.sub)}</p>${q.type==='choice'?`<div class="choices">${q.choices.map((option,i)=>`<button class="choice" data-action="choose" data-answer="${esc(option)}" ${app.answered?'disabled':''}>${String.fromCharCode(65+i)}.　${esc(option)}</button>`).join('')}</div>`:`<label class="visually-hidden" for="answerInput">計算の答え</label><input id="answerInput" class="answer-input" type="text" placeholder="例：2√3 / √6/2 / 5" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="none" ${app.answered?'disabled':''} value="${esc(app.inputValue||'')}"><div class="keypad">${['7','8','9','√','←','4','5','6','+','−','1','2','3','×','/','0','(',')','全消','決定'].map(x=>`<button class="key ${['√','+','−','×','/','(',')'].includes(x)?'accent':''} ${['←','全消'].includes(x)?'erase':''}" data-action="key" data-key="${x}" ${app.answered?'disabled':''} aria-label="${x}">${esc(x)}</button>`).join('')}</div>`}<div id="liveNotice" aria-live="polite">${app.warning?`<p class="error-message">${esc(app.warning)}</p>`:''}</div>${app.feedback?feedbackHTML():''}${!app.answered?`<div class="question-bottom"><button class="btn secondary" data-action="hint" ${app.hint?'disabled':''}>💡 ${app.hint?'ヒント表示中':'ヒントを見る'}</button>${q.type==='input'?'<button class="btn primary" data-action="submit">答え合わせする</button>':''}<button class="btn ghost" data-action="skip">わからない・パス</button></div>${app.hint?`<div class="hintbox">💡 ${esc(q.hint)}</div>`:''}`:`<div class="question-bottom"><button class="btn primary full" data-action="next">${nextLabel()}</button></div>`}</section><p class="micro center" style="margin-top:18px">${app.mode==='sprint'?'正解で10点＋連続ボーナス。60秒で最高記録を目指そう！':app.mode==='battle'?'1問30秒。正解＋残り時間のボーナスが得点になります。':'ヒントを使ってもクリアできるよ。わからないときは解説を読もう。'}</p></div>`}
function feedbackHTML(){const f=app.feedback;return `<div class="feedback ${f.ok?'correct-shine':'wrong'}" role="status"><strong>${f.ok?'🎉 '+esc(f.head):'📘 '+esc(f.head)}</strong><p>${esc(f.message)}</p><div>正解：<span class="answer">${esc(currentQ().answer)}</span></div><div class="explanation"><strong style="font-size:14px;color:var(--cyan)">🔎 解き方</strong><div style="margin-top:6px">${esc(currentQ().explanation)}</div></div></div>`}
function nextLabel(){if(app.mode==='lesson'&&app.idx===7)return '🏁 結果を見る';if(app.mode==='battle'&&app.turn===app.battleTeams.length*app.battleRoundCount-1)return '🏆 対戦結果を見る';return '次の問題へ ➜'}
function currentQ(){return app.mode==='battle'?app.questions[app.turn]:app.questions[app.idx]}
function render(){navSet();const main=$('#app');let html='';if(app.view==='home')html=home();else if(app.view==='stages')html=`<div class="page-title"><h1>学習ステージ</h1><p>まずは一番やさしい問題から。無理なく少しずつレベルアップしよう！</p></div>${stagesGrid(false)}`;else if(app.view==='intro')html=intro();else if(app.view==='game')html=game();else if(app.view==='result')html=resultView();else if(app.view==='sprint')html=sprintSetup();else if(app.view==='battle')html=battleSetup();else html=home();main.innerHTML=html;document.body.classList.toggle('large-text',!!data.large)}
function newLesson(stage){if(stage>data.unlocked)return;stopTimer();app={...app,view:'game',mode:'lesson',stage,questions:makeQuestions(stage,8),idx:0,correct:0,score:0,streak:0,maxStreak:0,hint:false,answered:false,tries:0,feedback:null,warning:'',inputValue:'',finished:null};render();focusAnswer()}
function focusAnswer(){if(window.matchMedia('(pointer:fine)').matches){const e=$('#answerInput');if(e)e.focus({preventScroll:true})}}
function timerStart(seconds){stopTimer();app.timeRemaining=seconds;app.deadline=Date.now()+seconds*1000;app.timer=setInterval(()=>{if(app.view!=='game')return stopTimer();app.timeRemaining=Math.max(0,(app.deadline-Date.now())/1000);const time=$('#timeLeft'),bar=$('#timeBar');if(time){time.textContent=Math.ceil(app.timeRemaining)+'秒';time.classList.toggle('low',app.timeRemaining<=10)}if(bar)bar.style.width=Math.max(0,app.timeRemaining/seconds*100)+'%';if(app.timeRemaining<=0){stopTimer();if(app.mode==='sprint')endSprint();else if(app.mode==='battle'&&!app.answered)checkAnswer(null,true)}},90)}
function startSprint(){stopTimer();const pool=Array.from({length:10},(_,i)=>i).filter(i=>i<=data.unlocked);const qs=[];for(let i=0;i<160;i++)qs.push(genQuestion(pick(pool)));app={...app,view:'game',mode:'sprint',idx:0,questions:qs,stage:0,correct:0,score:0,streak:0,maxStreak:0,hint:false,answered:false,tries:0,feedback:null,warning:'',inputValue:'',finished:null};render();timerStart(60);focusAnswer()}
function sprintSetup(){return `<div class="page-title"><div class="bread">SOLO CHALLENGE</div><h1>⏱ 60秒タイムアタック</h1><p>今の自分を超えるスピード勝負。解放済みのステージからランダムに出題！</p></div><div class="two-col"><section class="panel"><h2>⚡ ルール</h2><p>60秒間でできるだけ多くの問題に正解しよう。1問正解10点、連続正解でさらにボーナス！</p><div class="formula">自己ベスト ${data.sprintBest} pt</div><p class="muted">間違えた問題も解説を読んで次に進めるよ。ヒントを使うと得点が少し下がるよ。</p><button class="btn primary full" data-action="startSprint">▶ 60秒スタート！</button></section><aside class="panel"><h3>📊 これまでの記録</h3><div class="result-stats" style="grid-template-columns:repeat(2,1fr)"><div class="result-stat"><b>${data.sprintRuns}</b><small>挑戦回数</small></div><div class="result-stat"><b>${data.sprintBest}</b><small>最高点</small></div></div><p class="micro">※同じ端末に保存されている個人記録です。オンラインランキングではありません。</p></aside></div>`}
function battleSetup(){return `<div class="page-title"><div class="bread">LOCAL TEAM BATTLE</div><h1>🏆 チーム対抗ルートバトル</h1><p>1台の端末で2〜4チームが交代で挑戦。授業のクイズ大会に！</p></div><div class="two-col"><section class="panel"><h2>⚔️ 対戦を設定</h2><div class="form-row"><label class="form-label" for="teamCount">チーム数</label><select id="teamCount" class="form-field"><option value="2">2チーム</option><option value="3">3チーム</option><option value="4">4チーム</option></select></div><div id="teamNames"></div><div class="form-row"><label class="form-label" for="battleStage">出題するレベル（全ステージ選択可）</label><select id="battleStage" class="form-field">${STAGES.map((s,i)=>`<option value="${i}" ${i===Math.min(data.unlocked,9)?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></div><button class="btn primary full" data-action="startBattle">🏁 バトル開始！</button><p id="battleSetupError" class="error-message" aria-live="polite"></p></section><aside class="panel"><h3>📜 対戦ルール</h3><p class="bullet-text">各チームが順番に4問ずつ回答します。制限時間は1問30秒です。チームで相談しながら解こう！</p><div class="note"><strong>得点</strong><p style="margin:7px 0 0">正解で100点＋残り時間のボーナス（最大30点）。ヒント使用時はボーナスなし。</p></div><p class="micro">複数の端末をつなぐ通信対戦ではありません。みんなで1台の画面を見て使う方式です。</p></aside></div>`}
function updateTeamNames(){const count=Number($('#teamCount')?.value||2),box=$('#teamNames');if(!box)return;const prior=[...box.querySelectorAll('.team-name')].map(x=>x.value);box.innerHTML=Array.from({length:count},(_,i)=>`<div class="form-row"><label class="form-label" for="team${i}">チーム ${i+1} の名前</label><input class="form-field team-name" id="team${i}" maxlength="20" value="${esc(prior[i]||`チーム${i+1}`)}"></div>`).join('')}
function startBattle(){const names=[...document.querySelectorAll('.team-name')].map((x,i)=>x.value.trim()||`チーム${i+1}`);if(new Set(names).size!==names.length){$('#battleSetupError').textContent='チーム名はそれぞれ別の名前にしてね。';return}const stage=Number($('#battleStage').value);app={...app,view:'game',mode:'battle',battleStage:stage,battleTeams:names.map(name=>({name,score:0,correct:0})),turn:0,battleRoundCount:4,questions:makeQuestions(stage,names.length*4,false),idx:0,correct:0,score:0,streak:0,hint:false,answered:false,tries:0,feedback:null,warning:'',inputValue:'',finished:null};render();timerStart(30);focusAnswer()}
function showNotice(msg){app.warning=msg;const elem=$('#liveNotice');if(elem)elem.innerHTML=msg?`<p class="error-message">${esc(msg)}</p>`:''}
function checkAnswer(raw,timedOut=false){if(app.answered)return;const q=currentQ();let ok=false,semiright=false;if(raw!==null){if(q.type==='choice')ok=String(raw)===q.answer;else{try{const parsed=parse(raw);ok=isEqual(parsed,q.result);if(ok&&!simplest(raw,q.result)){semiright=true;ok=false}}catch(e){showNotice(e.message);return}}}if(semiright&&app.tries<1&&!timedOut){app.tries++;showNotice('惜しい！ 値は合っているよ。√を簡単にしたり、同じ√をまとめたりして、もう一度答えてみよう。');return}
 app.answered=true;app.warning='';if(app.mode==='battle'||app.mode==='sprint')stopTimer();if(app.mode==='lesson')data.totalAnswered++;if(ok){app.correct++;app.streak++;app.maxStreak=Math.max(app.maxStreak,app.streak);if(app.mode==='battle'){const t=app.battleTeams[app.turn%app.battleTeams.length];const pts=100+(app.hint?0:Math.ceil(app.timeRemaining));t.score+=pts;t.correct++;app.score+=pts}else{const pts=(app.hint?6:10)+Math.min(10,(app.streak-1)*2);app.score+=pts;if(app.mode==='lesson'){data.xp+=pts;data.totalCorrect++}}}else app.streak=0;if(app.mode==='lesson')save();app.feedback={ok,head:ok?(app.streak>=3?'連続正解！ すごい！':'正解！ やったね！'):(timedOut?'時間切れ！':'ナイスチャレンジ！'),message:ok?(app.hint?'ヒントを活かして解けたね！':'この調子で次も挑戦しよう。'):(semiright?'計算の値は合っていたよ。最後にもっと簡単にできるか見直そう。':'解き方を確認して、次の1問にいかそう。')};render();if(app.mode==='sprint')resumeSprintClock();}
function resumeSprintClock(){// スプリントは解説中も制限時間を進める
 if(app.view==='game'&&app.mode==='sprint'&&app.deadline>Date.now()){
  const remaining=Math.max(0,(app.deadline-Date.now())/1000);app.timeRemaining=remaining;
  const end=app.deadline;timerStartWithDeadline(end,60);
 }else if(app.mode==='sprint'&&app.deadline<=Date.now())endSprint();}
function timerStartWithDeadline(deadline,total){stopTimer();app.deadline=deadline;app.timeRemaining=Math.max(0,(deadline-Date.now())/1000);app.timer=setInterval(()=>{if(app.view!=='game')return stopTimer();app.timeRemaining=Math.max(0,(deadline-Date.now())/1000);const time=$('#timeLeft'),bar=$('#timeBar');if(time){time.textContent=Math.ceil(app.timeRemaining)+'秒';time.classList.toggle('low',app.timeRemaining<=10)}if(bar)bar.style.width=app.timeRemaining/total*100+'%';if(app.timeRemaining<=0){stopTimer();endSprint()}},90)}
function next(){if(!app.answered)return;app.hint=false;app.answered=false;app.feedback=null;app.warning='';app.inputValue='';app.tries=0;if(app.mode==='lesson'){app.idx++;if(app.idx>=8)return endLesson()}else if(app.mode==='sprint'){app.idx++;if(app.timeRemaining<=0)return endSprint()}else{app.turn++;if(app.turn>=app.battleTeams.length*app.battleRoundCount)return endBattle()}render();if(app.mode==='battle')timerStart(30);focusAnswer()}
function endLesson(){stopTimer();const clears=app.correct>=6;const stars=app.correct===8?3:app.correct===7?2:clears?1:0;if(stars>data.stars[app.stage])data.stars[app.stage]=stars;if(app.score>data.bests[app.stage])data.bests[app.stage]=app.score;if(clears&&app.stage===data.unlocked&&data.unlocked<9)data.unlocked++;save();app.finished={type:'lesson',clears,stars,correct:app.correct,score:app.score,stage:app.stage};app.view='result';render()}
function endSprint(){stopTimer();if(app.view==='result')return;data.sprintRuns++;const isBest=app.score>data.sprintBest;if(isBest)data.sprintBest=app.score;save();app.finished={type:'sprint',correct:app.correct,score:app.score,best:isBest,streak:app.maxStreak};app.view='result';render()}
function endBattle(){stopTimer();const teams=[...app.battleTeams].sort((a,b)=>b.score-a.score||b.correct-a.correct);app.finished={type:'battle',teams,stage:app.battleStage};app.view='result';render()}
function resultView(){const x=app.finished;if(!x)return home();if(x.type==='lesson'){const st=STAGES[x.stage];return `<div class="game-container"><section class="panel"><div class="result-hero"><div class="big">${x.clears?'🏅':'💪'}</div><div class="bread">STAGE ${x.stage+1} RESULT</div><h1>${x.clears?'ステージクリア！':'あと少し！ もう一度挑戦'}</h1><p>${esc(st.title)}　${x.clears?'次のステージへ進めるよ！':'解説を見直して再挑戦してみよう。'}</p><div style="font-size:32px;color:var(--gold)">${iconStars(x.stars)}</div></div><div class="result-stats"><div class="result-stat"><b>${x.correct}/8</b><small>正解数</small></div><div class="result-stat"><b>${x.score}</b><small>獲得ポイント</small></div><div class="result-stat"><b>${data.xp}</b><small>合計XP</small></div></div><div class="action-row"><button class="btn primary" data-action="intro" data-stage="${x.clears?Math.min(data.unlocked,x.stage+1):x.stage}">${x.clears&&x.stage<9?'次のステージへ':'もう一度おさらい'}</button><button class="btn secondary" data-action="replayLesson" data-stage="${x.stage}">🔁 もう一回</button><button class="btn ghost" data-action="go" data-view="stages">🗺 マップへ</button></div></section></div>`}
 if(x.type==='sprint')return `<div class="game-container"><section class="panel"><div class="result-hero"><div class="big">${x.best?'🏆':'⚡'}</div><div class="bread">TIME ATTACK RESULT</div><h1>${x.best?'自己ベスト更新！':'60秒チャレンジ終了！'}</h1><p>自分のペースで、何度でも記録更新に挑戦できるよ。</p></div><div class="result-stats"><div class="result-stat"><b>${x.score}</b><small>今回の得点</small></div><div class="result-stat"><b>${x.correct}</b><small>正解数</small></div><div class="result-stat"><b>${x.streak}</b><small>最多連続正解</small></div></div><p class="center muted">現在の自己ベスト：<b style="color:var(--gold)">${data.sprintBest} pt</b></p><div class="action-row"><button class="btn primary" data-action="startSprint">⏱ もう一度</button><button class="btn ghost" data-action="go" data-view="home">ホームへ</button></div></section></div>`;
 const top=x.teams[0].score;const winners=x.teams.filter(t=>t.score===top);return `<div class="game-container"><section class="panel"><div class="result-hero"><div class="big">🏆</div><div class="bread">TEAM BATTLE RESULT</div><h1>${winners.length>1?'同点優勝！':'優勝！'}</h1><p style="font-size:25px;color:var(--gold);font-weight:900">${winners.map(t=>esc(t.name)).join(' ・ ')}</p></div><div class="list-rows">${x.teams.map((t,i)=>`<div class="score-row"><div><span class="pill">${i+1}位</span>　<strong>${esc(t.name)}</strong><div class="micro">${t.correct} / ${app.battleRoundCount}問正解</div></div><b>${t.score} pt</b></div>`).join('')}</div><div class="action-row"><button class="btn primary" data-action="go" data-view="battle">🔁 条件を変えて再戦</button><button class="btn ghost" data-action="go" data-view="home">ホームへ</button></div></section></div>`}
function keyPress(key){if(app.answered)return;const el=$('#answerInput');if(!el)return;let start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length,v=el.value;const selected=v.slice(start,end);if(key==='決定')return checkAnswer(el.value);if(key==='全消'){v='';start=0}else if(key==='←'){if(start===end&&start>0)start--;v=v.slice(0,start)+v.slice(end)}else{v=v.slice(0,start)+key+v.slice(end);start+=key.length}el.value=v;app.inputValue=v;showNotice('');el.focus({preventScroll:true});el.setSelectionRange(start,start)}
function clickAction(el){const act=el.dataset.action;if(act==='go')navi(el.dataset.view);else if(act==='intro'){const stage=Number(el.dataset.stage);if(stage<=data.unlocked){stopTimer();app.stage=stage;app.view='intro';render();window.scrollTo(0,0)}}else if(act==='startLesson')newLesson(app.stage);else if(act==='replayLesson')newLesson(Number(el.dataset.stage));else if(act==='startSprint')startSprint();else if(act==='startBattle')startBattle();else if(act==='toggleLarge'){data.large=!data.large;save();render()}else if(act==='key')keyPress(el.dataset.key);else if(act==='choose')checkAnswer(el.dataset.answer);else if(act==='submit')checkAnswer($('#answerInput')?.value||'');else if(act==='hint'){app.hint=true;app.warning='';const q=currentQ();const e=document.createElement('div');e.className='hintbox';e.textContent='💡 '+q.hint;const fb=$('#liveNotice');if(fb)fb.after(e);el.disabled=true;el.textContent='💡 ヒント表示中'}else if(act==='skip')checkAnswer(null);else if(act==='next')next();else if(act==='exitGame'){if(confirm('このチャレンジを終了してホームに戻りますか？（進行中の結果は保存されません）'))navi('home')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav)return navi(nav.dataset.nav);const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled)clickAction(btn)});
document.addEventListener('change',e=>{if(e.target.id==='teamCount')updateTeamNames()});
document.addEventListener('input',e=>{if(e.target.id==='answerInput')app.inputValue=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answerInput'&&!app.answered){e.preventDefault();checkAnswer(e.target.value)}else if((e.key==='Enter'||e.key===' ')&&e.target.id==='logoHome')navi('home')});
$('#logoHome').addEventListener('click',()=>navi('home'));
const oldRender=render;render=function(){oldRender();if(app.view==='battle')updateTeamNames()};
render();

window.__rootQuestTests={sqfree,parse,fmt,root,integer,plus,minus,times,divide,isEqual,simplest,genQuestion,makeQuestions};
